<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="33%" stop-color="#3b82f6" />
      <stop offset="66%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="960" height="4" fill="url(#accentGrad)" />

  <!-- SECTION 1: INPUT SOURCES -->
  <g id="input-group">
    <rect x="40" y="45" width="220" height="290" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)" />
    <text x="150" y="80" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle">INPUT SOURCES</text>
    
    <!-- Mandiri -->
    <rect x="60" y="105" width="180" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="75" y="131" fill="#f8fafc" font-size="13" font-weight="600">Bank Mandiri</text>
    <rect x="180" y="116" width="48" height="20" rx="4" fill="#78350f" />
    <text x="204" y="130" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">.CSV</text>

    <!-- BCA -->
    <rect x="60" y="160" width="180" height="42" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="75" y="186" fill="#f8fafc" font-size="13" font-weight="600">Bank BCA</text>
    <rect x="180" y="171" width="48" height="20" rx="4" fill="#1e3a8a" />
    <text x="204" y="185" fill="#bfdbfe" font-size="10" font-weight="700" text-anchor="middle">.PDF</text>

    <!-- BRI -->
    <rect x="60" y="215" width="180" height="42" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1" />
    <text x="75" y="241" fill="#f8fafc" font-size="13" font-weight="600">Bank BRI</text>
    <rect x="180" y="226" width="48" height="20" rx="4" fill="#0c4a6e" />
    <text x="204" y="240" fill="#bae6fd" font-size="10" font-weight="700" text-anchor="middle">.CSV</text>

    <!-- BSI -->
    <rect x="60" y="270" width="180" height="42" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="75" y="296" fill="#f8fafc" font-size="13" font-weight="600">Bank BSI</text>
    <rect x="180" y="281" width="48" height="20" rx="4" fill="#064e3b" />
    <text x="204" y="295" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">.XLSX</text>
  </g>

  <!-- CONNECTOR 1 -->
  <path d="M 260 190 L 330 190" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="330,185 340,190 330,195" fill="#64748b" />

  <!-- SECTION 2: CLIENT PROCESSING ENGINE -->
  <g id="engine-group">
    <rect x="340" y="45" width="280" height="290" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" filter="url(#dropShadow)" />
    <text x="480" y="80" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle">CLIENT-SIDE PROCESSING ENGINE</text>
    <text x="480" y="98" fill="#64748b" font-size="10" text-anchor="middle">Zero Server Transmission • 100% In-Memory</text>

    <!-- Sub-module 1: In-Browser Parsing -->
    <rect x="360" y="115" width="240" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="375" y="137" fill="#f1f5f9" font-size="12" font-weight="600">PDF.js &amp; SheetJS In-Memory Decoders</text>
    <text x="375" y="152" fill="#94a3b8" font-size="10">Raw binary &amp; text vector extraction</text>

    <!-- Sub-module 2: Multi-line Normalizer -->
    <rect x="360" y="173" width="240" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="375" y="195" fill="#f1f5f9" font-size="12" font-weight="600">Multiline Transaction Clustering</text>
    <text x="375" y="210" fill="#94a3b8" font-size="10">Aggregates transfer notes &amp; counterparties</text>

    <!-- Sub-module 3: Balance Reconciler -->
    <rect x="360" y="231" width="240" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="375" y="253" fill="#f1f5f9" font-size="12" font-weight="600">Balance &amp; Integrity Validator</text>
    <text x="375" y="268" fill="#94a3b8" font-size="10">Reconstructs running balances &amp; checks gaps</text>

    <!-- Tag -->
    <rect x="425" y="293" width="110" height="22" rx="11" fill="#065f46" />
    <text x="480" y="308" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">100% PRIVATE</text>
  </g>

  <!-- CONNECTOR 2 -->
  <path d="M 620 190 L 690 190" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="690,185 700,190 690,195" fill="#64748b" />

  <!-- SECTION 3: EXPORT TARGETS -->
  <g id="output-group">
    <rect x="700" y="45" width="220" height="290" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)" />
    <text x="810" y="80" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle">OUTPUT TARGETS</text>

    <!-- Odoo Statement -->
    <rect x="720" y="115" width="180" height="85" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
    <text x="735" y="142" fill="#ffffff" font-size="13" font-weight="700">Odoo Statement</text>
    <text x="735" y="160" fill="#a5b4fc" font-size="11">Format: Excel (.xlsx)</text>
    <text x="735" y="180" fill="#94a3b8" font-size="10">Cols: Date, Label, Partner, Amount</text>

    <!-- Audit Mutasi -->
    <rect x="720" y="215" width="180" height="85" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="735" y="242" fill="#ffffff" font-size="13" font-weight="700">Audit Table Mutasi</text>
    <text x="735" y="260" fill="#7dd3fc" font-size="11">Format: Excel (.xlsx)</text>
    <text x="735" y="280" fill="#94a3b8" font-size="10">Full columns + Running Balances</text>
  </g>
</svg>
